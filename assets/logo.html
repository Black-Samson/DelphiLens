<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.wrap{display:flex;align-items:center;gap:36px;padding:40px 56px;background:#0A1211;width:max-content}
.wrap.light{background:#F4EEE1}
.word{font:700 112px/1 Oswald, Impact, sans-serif;letter-spacing:.01em;text-transform:uppercase;color:#EFE4CC}
.light .word{color:#17221F}
.word span{color:#D9532B;font-size:64px;vertical-align:.32em;padding:0 6px}
.word b{color:#C9AE86;font-weight:700}
.light .word b{color:#7A5C34}
img{width:150px;height:150px}
</style></head><body>
<div id="dark" class="wrap"><img src="icon.svg"><div class="word">Delphi<span>/</span><b>Lens</b></div></div>
<div id="light" class="wrap light"><img src="icon.svg"><div class="word">Delphi<span>/</span><b>Lens</b></div></div>
</body></html>
